version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg15
    environment:
      - POSTGRES_USER=agrotrace
      - POSTGRES_PASSWORD=agrotrace_dev
      - POSTGRES_DB=agrotrace
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrotrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=agrotrace
      - POSTGRES_PASSWORD=agrotrace_dev
      - POSTGRES_DB=agrotrace
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - MQTT_BROKER=mosquitto
      - SECRET_KEY=agrotrace_dev_secret_key
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  timescaledb-data:
