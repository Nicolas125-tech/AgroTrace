version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agrotrace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-agrotrace}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrotrace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agrotrace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-agrotrace}
      - POSTGRES_HOST=${POSTGRES_HOST:-timescaledb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  timescaledb-data:
